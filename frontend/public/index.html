<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Inmuebles Ariel - Estrategia inmobiliaria premium" />
    <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
    <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/logo1.png?v=4" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo1.png?v=4" />
    <title>Ariel Maggio | Inmobiliaria Premium</title>

    <script type="text/javascript">
        // Restaura el path original tras la redirección del 404.html (SPA GitHub Pages)
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>

    <style>
        #emergent-badge,
        a[href*="emergent.sh"],
        [id*="emergent"],
        [class*="emergent"] {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
            z-index: -9999 !important;
            height: 0 !important;
            width: 0 !important;
            overflow: hidden !important;
        }
    </style>
</head>
